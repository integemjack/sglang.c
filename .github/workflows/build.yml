name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,        os: ubuntu-latest,    gen: ninja }
          - { name: linux-arm64,      os: ubuntu-24.04-arm, gen: ninja }
          - { name: macos-arm64,      os: macos-latest,     gen: ninja }
          - { name: macos-x64,        os: macos-13,         gen: ninja }
          - { name: windows-x64,      os: windows-latest,   gen: msvc }
          - { name: windows-x64-cuda, os: windows-latest,   gen: msvc-cuda }
        # windows-latest 自 2026-06 起预装 VS2026（18\），不用 VS 生成器：
        # msvc-dev-cmd 自动发现已装 VS 激活 cl 环境 + Ninja 生成器，未来镜像换代免疫

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Linux/macOS)
        if: matrix.gen == 'ninja'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ninja
          else
            sudo apt-get update && sudo apt-get install -y ninja-build
          fi

      # tests 的 gpt2 真实权重（~520MB）不入库，CI 按需下载；tokenizer/config 已在仓库
      - name: Download GPT-2 weights
        if: matrix.gen != 'msvc-cuda'
        shell: bash
        run: |
          mkdir -p models/gpt2
          curl -L --retry 5 --retry-all-errors \
            -o models/gpt2/model.safetensors \
            https://huggingface.co/openai-community/gpt2/resolve/main/model.safetensors

      - name: Configure (Ninja)
        if: matrix.gen == 'ninja'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build (Ninja)
        if: matrix.gen == 'ninja'
        run: cmake --build build -j

      - name: Setup MSVC
        if: matrix.gen == 'msvc' || matrix.gen == 'msvc-cuda'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # runner 不预装 CUDA toolkit；装全量（含 cublas/cudart 库与 DLL）
      # Jimver 会设 CUDA_PATH 并把 CUDA_PATH/bin 加进 PATH，命中 CMakeLists 的自动发现
      - name: Install CUDA toolkit
        if: matrix.gen == 'msvc-cuda'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.3.0'

      - name: Configure (MSVC)
        if: matrix.gen == 'msvc' || matrix.gen == 'msvc-cuda'
        shell: pwsh
        run: |
          $cuda = if ("${{ matrix.gen }}" -eq "msvc-cuda") { "-DSGL_CUDA=ON" } else { "" }
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded $cuda

      - name: Build (MSVC)
        if: matrix.gen == 'msvc' || matrix.gen == 'msvc-cuda'
        run: cmake --build build --parallel

      - name: Test (CPU builds)
        if: matrix.gen != 'msvc-cuda'
        shell: bash
        run: ctest --test-dir build --output-on-failure --timeout 900

      # CI runner 无 GPU：CUDA job 只验证编译/链接，smoke 走 usage 分支（exit 1）
      # 注意：不能写 2>&1 | Out-Null —— Actions 的 pwsh 默认 ErrorActionPreference=stop，
      # stderr 会变 ErrorRecord 直接杀脚本；让 stderr 透传，只看 LASTEXITCODE
      - name: Smoke (CUDA build)
        if: matrix.gen == 'msvc-cuda'
        shell: pwsh
        run: |
          & "build/bin/cuda_cli.exe" | Out-Null
          $code = $LASTEXITCODE
          Write-Host "cuda_cli usage exit code: $code"
          if ($code -ne 1) { throw "cuda_cli usage smoke failed ($code)" }
          Write-Host "cuda_cli smoke OK (usage exit 1)"

      - name: Package (Linux/macOS)
        if: matrix.gen == 'ninja'
        shell: bash
        run: |
          mkdir -p dist
          cp build/bin/sglc dist/
          cp README.md ROADMAP.md dist/
          tar czf "sglang-c-${{ matrix.name }}.tar.gz" -C dist .
          ls -la sglang-c-*.tar.gz

      - name: Package (Windows CPU)
        if: matrix.gen == 'msvc'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/bin/sglc.exe dist/
          Copy-Item README.md, ROADMAP.md dist/
          Compress-Archive -Path dist/* -DestinationPath "sglang-c-${{ matrix.name }}.zip"
          Get-ChildItem "sglang-c-*.zip"

      - name: Package (Windows CUDA)
        if: matrix.gen == 'msvc-cuda'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/bin/sglc.exe dist/
          Copy-Item build/bin/cuda_cli.exe dist/
          Copy-Item build/bin/cuda_http.exe dist/
          # cublas 是动态链接（cudart 已静态），分发须带 DLL
          Copy-Item "$env:CUDA_PATH/bin/cublas64_*.dll" dist/
          Copy-Item README.md, ROADMAP.md dist/
          Compress-Archive -Path dist/* -DestinationPath "sglang-c-${{ matrix.name }}.zip"
          Get-ChildItem "sglang-c-*.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: sglang-c-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
