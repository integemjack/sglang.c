name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,        os: ubuntu-latest,    gen: ninja }
          - { name: linux-arm64,      os: ubuntu-24.04-arm, gen: ninja }
          - { name: macos-arm64,      os: macos-latest,     gen: ninja }
          - { name: macos-x64,        os: macos-14,         gen: ninja-x64 }
        # macos-x64 不再用 macos-13（最后的 Intel 镜像，2026-10 容量枯竭：连续三轮
        # 排队 30-60 分钟+从未起跑）：改 macos-14（arm64）交叉编译 x86_64 产物，
        # runner 的 Rosetta 2 透明转译跑测试
          - { name: windows-x64,      os: windows-latest,   gen: msvc }
          - { name: windows-x64-cuda, os: windows-latest,   gen: msvc-cuda }
        # windows-latest 自 2026-06 起预装 VS2026（18\），不用 VS 生成器：
        # msvc-dev-cmd 自动发现已装 VS 激活 cl 环境 + Ninja 生成器，未来镜像换代免疫

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Linux/macOS)
        if: matrix.gen == 'ninja' || matrix.gen == 'ninja-x64'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ninja
          else
            sudo apt-get update && sudo apt-get install -y ninja-build
          fi

      # tests 的 gpt2 真实权重（~520MB）不入库，CI 按需下载；tokenizer/config 已在仓库
      - name: Download GPT-2 weights
        if: matrix.gen != 'msvc-cuda'
        shell: bash
        run: |
          mkdir -p models/gpt2
          curl -L --retry 5 --retry-all-errors \
            -o models/gpt2/model.safetensors \
            https://huggingface.co/openai-community/gpt2/resolve/main/model.safetensors

      - name: Configure (Ninja)
        if: matrix.gen == 'ninja' || matrix.gen == 'ninja-x64'
        run: |
          if [ "${{ matrix.gen }}" = "ninja-x64" ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_C_FLAGS=-march=x86-64-v2
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build (Ninja)
        if: matrix.gen == 'ninja' || matrix.gen == 'ninja-x64'
        run: cmake --build build -j

      - name: Setup MSVC
        if: matrix.gen == 'msvc' || matrix.gen == 'msvc-cuda'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # runner 不预装 CUDA toolkit；装全量（含 cublas/cudart 库与 DLL）
      # Jimver 会设 CUDA_PATH 并把 CUDA_PATH/bin 加进 PATH，命中 CMakeLists 的自动发现
      - name: Install CUDA toolkit
        if: matrix.gen == 'msvc-cuda'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.3.0'

      - name: Configure (MSVC)
        if: matrix.gen == 'msvc' || matrix.gen == 'msvc-cuda'
        shell: pwsh
        run: |
          $cuda = if ("${{ matrix.gen }}" -eq "msvc-cuda") { "-DSGL_CUDA=ON" } else { "" }
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded $cuda

      - name: Build (MSVC)
        if: matrix.gen == 'msvc' || matrix.gen == 'msvc-cuda'
        run: cmake --build build --parallel

      - name: Test (CPU builds)
        if: matrix.gen != 'msvc-cuda'
        shell: bash
        run: ctest --test-dir build --output-on-failure --timeout 900

      # CI runner 无 NVIDIA 驱动：cuda_cli/cuda_http 动态链 cublas（→nvcuda.dll）启动即
      # 0xC0000135，无法在无 GPU runner 上运行 —— 只验证产物存在；可加载 smoke 用同
      # job 构建的纯 CPU sglc（usage 分支 exit 1，不链任何 CUDA 库）
      - name: Smoke (CUDA build)
        if: matrix.gen == 'msvc-cuda'
        shell: pwsh
        run: |
          Get-Item build/bin/cuda_cli.exe, build/bin/cuda_http.exe, build/bin/sglc.exe | Out-Null
          & "build/bin/sglc.exe" | Out-Null
          $code = $LASTEXITCODE
          Write-Host "sglc usage exit code: $code"
          if ($code -ne 1) { throw "sglc usage smoke failed ($code)" }
          Write-Host "smoke OK (3 exes present, sglc usage exit 1)"
          # Actions 的 pwsh wrapper 在脚本尾 exit $LASTEXITCODE（usage 留下的 1）；显式清零
          exit 0

      - name: Package (Linux/macOS)
        if: matrix.gen == 'ninja' || matrix.gen == 'ninja-x64'
        shell: bash
        run: |
          mkdir -p dist
          cp build/bin/sglc dist/
          cp README.md ROADMAP.md dist/
          tar czf "sglang-c-${{ matrix.name }}.tar.gz" -C dist .
          ls -la sglang-c-*.tar.gz

      - name: Package (Windows CPU)
        if: matrix.gen == 'msvc'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/bin/sglc.exe dist/
          Copy-Item README.md, ROADMAP.md dist/
          Compress-Archive -Path dist/* -DestinationPath "sglang-c-${{ matrix.name }}.zip"
          Get-ChildItem "sglang-c-*.zip"

      - name: Package (Windows CUDA)
        if: matrix.gen == 'msvc-cuda'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/bin/sglc.exe dist/
          Copy-Item build/bin/cuda_cli.exe dist/
          Copy-Item build/bin/cuda_http.exe dist/
          # cublas 是动态链接（cudart 已静态），分发须带 DLL
          Copy-Item "$env:CUDA_PATH/bin/cublas64_*.dll" dist/
          Copy-Item README.md, ROADMAP.md dist/
          Compress-Archive -Path dist/* -DestinationPath "sglang-c-${{ matrix.name }}.zip"
          Get-ChildItem "sglang-c-*.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: sglang-c-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
